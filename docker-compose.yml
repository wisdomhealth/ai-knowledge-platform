services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_knowledge_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledge_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_knowledge_platform
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./chroma:/app/chroma

volumes:
  postgres_data:
