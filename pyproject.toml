[project]
name = "ai-knowledge-platform"
version = "0.1.0"
description = "Production-ready AI backend platform for RAG, agents, integrations, and voice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "chromadb>=0.5.5",
    "fastapi>=0.111.0",
    "google-api-python-client>=2.137.0",
    "google-auth>=2.32.0",
    "httpx>=0.27.0",
    "lxml>=5.2.2",
    "openai>=1.40.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.31",
    "twilio>=9.2.3",
    "uvicorn[standard]>=0.30.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
